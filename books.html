<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Book Corner — Joe Lyimo | FYJ</title>
<meta name="description" content="The Book Corner by Joe Lyimo (FYJ). Open worlds, one book at a time.">
<meta property="og:title" content="The Book Corner — Joe Lyimo | FYJ">
<meta property="og:image" content="assets/fyj-mark.png">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{
--ink:#0b0b0c;
--panel:#161310;
--gold:#c9a24b;
--gold-bright:#f0d38a;
--bone:#f3ecdd;
--bone-dim:#c9c0ac;
--line:rgba(201,162,75,0.18);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--ink);color:var(--bone);font-family:'Inter',sans-serif;line-height:1.7;overflow-x:hidden;}
img{max-width:100%;display:block;}
h1,h2,h3{font-family:'Fraunces',serif;font-weight:500;letter-spacing:-0.01em;}

/* NAV */
.nav{
position:fixed;top:0;left:0;right:0;z-index:500;
display:flex;justify-content:space-between;align-items:center;
padding:18px 5%;
background:linear-gradient(180deg,rgba(11,11,12,0.92),transparent);
backdrop-filter:blur(6px);
}
.nav .mark{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--gold-bright);font-family:'Fraunces',serif;letter-spacing:0.04em;}
.nav .mark img{width:30px;height:30px;}
.nav .back{font-family:'Space Mono',monospace;font-size:0.7rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--bone-dim);text-decoration:none;transition:.3s;}
.nav .back:hover{color:var(--gold-bright);}

/* BANNER */
.banner{
position:relative;
min-height:62vh;
display:flex;flex-direction:column;align-items:center;justify-content:center;
text-align:center;
padding:120px 6% 60px;
background:
linear-gradient(180deg,rgba(11,11,12,0.45) 0%,rgba(11,11,12,0.95) 100%),
url('assets/books-hero.jpg') center/cover no-repeat,
radial-gradient(ellipse at 30% 20%,#4a3320,#17110b 70%);
}
.banner .mark-spin{
width:clamp(110px,24vw,170px);
margin-bottom:18px;
filter:drop-shadow(0 0 35px rgba(201,162,75,0.45));
animation:spin 32s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.banner h1{font-size:clamp(3.2rem,11vw,6.4rem);line-height:0.95;letter-spacing:0.03em;}
.banner .sub{font-style:italic;font-family:'Fraunces',serif;color:var(--gold-bright);font-size:clamp(1.3rem,3.4vw,2rem);margin-top:6px;}
.banner .line{color:var(--bone-dim);margin-top:12px;max-width:460px;font-size:0.98rem;}

.rise{opacity:0;transform:translateY(22px);animation:rise 1.1s ease forwards;}
.rise.d1{animation-delay:.15s}.rise.d2{animation-delay:.4s}.rise.d3{animation-delay:.65s}.rise.d4{animation-delay:.9s}
@keyframes rise{to{opacity:1;transform:translateY(0);}}

/* SLIDER */
.shelf{padding:70px 0 90px;position:relative;}
.shelf-head{display:flex;justify-content:space-between;align-items:center;max-width:1180px;margin:0 auto 26px;padding:0 6%;}
.eyebrow{font-family:'Space Mono',monospace;font-size:0.72rem;letter-spacing:3px;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:14px;}
.eyebrow::before{content:'';width:26px;height:1px;background:var(--gold);}
.arrows{display:flex;gap:10px;}
.arrows button{
width:46px;height:46px;border-radius:50%;
background:transparent;border:1px solid var(--line);color:var(--gold-bright);
font-size:1.1rem;cursor:pointer;transition:.3s;
}
.arrows button:hover{border-color:var(--gold);background:rgba(201,162,75,0.1);}

.track{
display:flex;
overflow-x:auto;
scroll-snap-type:x mandatory;
scroll-behavior:smooth;
-webkit-overflow-scrolling:touch;
scrollbar-width:none;
}
.track::-webkit-scrollbar{display:none;}

.slide{
flex:0 0 100%;
scroll-snap-align:center;
display:flex;justify-content:center;
padding:0 5%;
}

.book{
width:100%;max-width:1060px;
display:grid;
grid-template-columns:minmax(220px,0.8fr) 1.2fr;
gap:clamp(24px,5vw,60px);
align-items:center;
padding:clamp(22px,4vw,44px);
background:var(--panel);
border:1px solid var(--line);
}

.cover-frame{
padding:12px;
border:1px solid var(--line);
background:rgba(201,162,75,0.04);
box-shadow:0 30px 60px rgba(0,0,0,0.5);
}
.cover{
aspect-ratio:2/3;
width:100%;
display:flex;align-items:center;justify-content:center;
background:radial-gradient(ellipse at 50% 30%,#3b2a16,#120d08 75%);
overflow:hidden;
}
.cover img.real{width:100%;height:100%;object-fit:cover;}
.cover img.ph{width:55%;opacity:0.9;filter:drop-shadow(0 0 25px rgba(201,162,75,0.4));}

.tag{
display:inline-block;
font-family:'Space Mono',monospace;font-size:0.65rem;letter-spacing:2px;text-transform:uppercase;
color:var(--gold);border:1px solid var(--line);padding:4px 12px;margin-bottom:16px;
}
.book h2{font-size:clamp(2rem,5vw,3.2rem);line-height:1.05;}
.book h2 em{display:block;color:var(--gold-bright);font-style:italic;}
.by{font-style:italic;font-family:'Fraunces',serif;color:var(--bone-dim);margin:10px 0 16px;}
.blurb{color:var(--bone-dim);font-size:0.97rem;max-width:480px;}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px;}
.btn{
display:inline-block;padding:14px 26px;
font-family:'Space Mono',monospace;font-size:0.72rem;letter-spacing:1.5px;text-transform:uppercase;
text-decoration:none;border:1px solid var(--gold);transition:.3s;
}
.btn-gold{background:var(--gold);color:var(--ink);}
.btn-gold:hover{background:var(--gold-bright);border-color:var(--gold-bright);}
.btn-ghost{color:var(--gold-bright);}
.btn-ghost:hover{background:rgba(201,162,75,0.1);}

.dots{display:flex;justify-content:center;gap:10px;margin-top:30px;}
.dots button{
width:9px;height:9px;border-radius:50%;border:0;cursor:pointer;
background:rgba(201,162,75,0.3);transition:.3s;
}
.dots button.on{background:var(--gold);transform:scale(1.35);box-shadow:0 0 12px rgba(201,162,75,0.6);}

/* modern rounded edges */
.book{border-radius:28px;}
.cover-frame{border-radius:22px;}
.cover{border-radius:14px;}
.btn{border-radius:100px;}
.tag{border-radius:100px;}

.foot{padding:40px 6% 36px;text-align:center;border-top:1px solid var(--line);}
.foot a{font-family:'Space Mono',monospace;font-size:0.72rem;letter-spacing:2px;text-transform:uppercase;color:var(--gold-bright);text-decoration:none;}

@media(max-width:760px){
.book{grid-template-columns:1fr;text-align:center;}
.cover-frame{max-width:240px;margin:0 auto;}
.blurb{margin:0 auto;}
.actions{justify-content:center;}
.slide{padding:0 4%;}
}
@media(prefers-reduced-motion:reduce){*{animation:none !important;}.rise{opacity:1;transform:none;}}
</style>
</head>
<body>

<nav class="nav">
<a href="joe.html" class="mark"><img src="assets/fyj-mark.png" alt="FYJ">JOE LYIMO</a>
<a href="joe.html#worlds" class="back">← Back</a>
</nav>

<header class="banner">
<img src="assets/fyj-mark.png" alt="FYJ" class="mark-spin rise d1">
<h1 class="rise d2">BOOKS</h1>
<div class="sub rise d3">open worlds.</div>
<p class="line rise d4">Step into the book corner. Swipe through the shelf.</p>
</header>

<section class="shelf">
<div class="shelf-head">
<div class="eyebrow">The Shelf</div>
<div class="arrows">
<button id="prev" aria-label="Previous book">←</button>
<button id="next" aria-label="Next book">→</button>
</div>
</div>

<div class="track" id="track"></div>
<div class="dots" id="dots"></div>
</section>

<div class="foot"><a href="joe.html">← Back to Joe Lyimo</a></div>

<script>
/* ===== ADD YOUR BOOKS HERE =====
   Copy one block per book. cover: path to the cover image (leave "" to show the FYJ mark).
   buy / more: links (leave "" to hide the button). */
var BOOKS = [
  {
    tag: "Book One",
    title: "Your Book Title",
    subtitle: "Subtitle goes here",
    author: "by Joe Lyimo",
    blurb: "Write a short, warm description of the book here: what it is about and who it is for.",
    cover: "",
    buy: "",
    buyLabel: "Get the book",
    more: ""
  },
  {
    tag: "Book Two",
    title: "Another Title",
    subtitle: "Subtitle goes here",
    author: "by Joe Lyimo",
    blurb: "A few sentences about the second book.",
    cover: "",
    buy: "",
    buyLabel: "Get the book",
    more: ""
  },
  {
    tag: "Coming Soon",
    title: "The Next One",
    subtitle: "In the making",
    author: "by Joe Lyimo",
    blurb: "A glimpse of what is coming next.",
    cover: "",
    buy: "",
    buyLabel: "Get the book",
    more: ""
  }
];

(function(){
  var track = document.getElementById('track');
  var dots = document.getElementById('dots');

  BOOKS.forEach(function(b, i){
    var coverHtml = b.cover
      ? '<img class="real" src="'+b.cover+'" alt="'+b.title+' cover">'
      : '<img class="ph" src="assets/fyj-mark.png" alt="FYJ">';
    var actions = '';
    if(b.buy)  actions += '<a class="btn btn-gold" href="'+b.buy+'" target="_blank">'+(b.buyLabel||'Get the book')+'</a>';
    if(b.more) actions += '<a class="btn btn-ghost" href="'+b.more+'" target="_blank">Read more ↓</a>';

    var slide = document.createElement('div');
    slide.className = 'slide';
    slide.innerHTML =
      '<article class="book">' +
        '<div class="cover-frame"><div class="cover">'+coverHtml+'</div></div>' +
        '<div>' +
          '<span class="tag">'+b.tag+'</span>' +
          '<h2>'+b.title+'<em>'+b.subtitle+'</em></h2>' +
          '<div class="by">'+b.author+'</div>' +
          '<p class="blurb">'+b.blurb+'</p>' +
          '<div class="actions">'+actions+'</div>' +
        '</div>' +
      '</article>';
    track.appendChild(slide);

    var d = document.createElement('button');
    d.setAttribute('aria-label','Go to book '+(i+1));
    d.addEventListener('click', function(){ go(i); });
    dots.appendChild(d);
  });

  var current = 0;
  function go(i){
    current = Math.max(0, Math.min(BOOKS.length-1, i));
    track.scrollTo({left: current * track.clientWidth, behavior:'smooth'});
  }
  function mark(){
    var i = Math.round(track.scrollLeft / track.clientWidth);
    current = i;
    Array.prototype.forEach.call(dots.children, function(el, k){ el.classList.toggle('on', k===i); });
  }
  track.addEventListener('scroll', function(){ window.requestAnimationFrame(mark); });
  document.getElementById('prev').addEventListener('click', function(){ go(current-1); });
  document.getElementById('next').addEventListener('click', function(){ go(current+1); });
  document.addEventListener('keydown', function(e){
    if(e.key==='ArrowRight') go(current+1);
    if(e.key==='ArrowLeft')  go(current-1);
  });
  window.addEventListener('resize', function(){ track.scrollLeft = current * track.clientWidth; });
  mark();
})();
</script>
</body>
</html>
